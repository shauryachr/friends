<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>People Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --card: #fffdf7;
      --accent: #b8882a;
      --accent-light: #e8c96a;
      --accent-pale: #fdf6e3;
      --text: #1a1610;
      --muted: #9a8f7a;
      --border: #e8d9b0;
      --shadow: rgba(180, 140, 40, 0.13);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -18%;
      right: -12%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(232,201,106,0.22) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    .glow2 {
      position: fixed;
      bottom: -16%;
      left: -10%;
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(232,201,106,0.13) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 40px 24px;
      text-align: center;
    }

    .top-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.1s;
    }

    .top-rule::before,
    .top-rule::after {
      content: '';
      width: 48px;
      height: 1px;
    }

    .top-rule::before { background: linear-gradient(90deg, transparent, var(--accent-light)); }
    .top-rule::after  { background: linear-gradient(90deg, var(--accent-light), transparent); }

    .rule-diamond {
      width: 6px;
      height: 6px;
      background: var(--accent);
      transform: rotate(45deg);
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.25s;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.4s;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 52px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.5s;
    }

    .people-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .person-card {
      display: block;
      text-decoration: none;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 26px 30px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.65s;
      cursor: pointer;
      box-shadow: 0 2px 16px var(--shadow);
    }

    .person-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(232,201,106,0.18) 0%, rgba(255,255,255,0) 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .person-card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: linear-gradient(180deg, var(--accent-light), var(--accent));
      opacity: 0;
      transition: opacity 0.3s ease, top 0.3s ease, bottom 0.3s ease;
    }

    .person-card:hover {
      border-color: var(--accent-light);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(180,140,40,0.18), 0 2px 8px var(--shadow);
      background: #fffef9;
    }

    .person-card:hover::before { opacity: 1; }
    .person-card:hover::after  { opacity: 1; top: 14%; bottom: 14%; }

    .card-inner {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 14px rgba(184,136,42,0.25);
    }

    .person-card:hover .avatar {
      transform: scale(1.1) rotate(-4deg);
      box-shadow: 0 6px 20px rgba(184,136,42,0.38);
    }

    .card-text {
      text-align: left;
      flex: 1;
    }

    .person-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      display: block;
      transition: color 0.3s ease;
    }

    .person-card:hover .person-name { color: var(--accent); }

    .arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
      transition: transform 0.3s ease, color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
      flex-shrink: 0;
    }

    .person-card:hover .arrow {
      transform: translateX(4px);
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .bottom-ornament {
      margin-top: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.9s;
    }

    .bottom-rule {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bottom-rule::before,
    .bottom-rule::after {
      content: '';
      width: 36px;
      height: 1px;
      background: var(--border);
    }

    .bottom-diamond {
      width: 5px;
      height: 5px;
      background: var(--accent-light);
      transform: rotate(45deg);
    }

    .footer {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow2"></div>
  <div class="container">
    <div class="top-rule"><div class="rule-diamond"></div></div>
    <p class="eyebrow">People Directory</p>
    <h1>Select a Profile</h1>
    <p class="subtitle">Choose a name to view their personal page</p>

    <div class="people-grid">
      <a class="person-card" href="/aaradhya">
        <div class="card-inner">
          <div class="avatar">A</div>
          <div class="card-text">
            <span class="person-name">Aaradhya</span>
          </div>
          <div class="arrow">→</div>
        </div>
      </a>
    </div>

    <div class="bottom-ornament">
      <div class="bottom-rule"><div class="bottom-diamond"></div></div>
      <p class="footer">© 2026 People Directory</p>
    </div>
  </div>
</body>
</html>
